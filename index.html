    <script>
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason.message).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && String(e.message).includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
